services:
  - type: web
    name: trackingexpressvn
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: REFRESH_INTERVAL_SECONDS
        value: "600"
      - key: DELETE_AFTER_DELIVERED_DAYS
        value: "7"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_BASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: "6081972689"        # vd: 123456789,987654321
       - key: DB_DIR
         value: /opt/render/project/src/data
